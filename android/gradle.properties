org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation caches (avoids memory-mapped cache errors on Windows)
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2

# AGP 9 turns on R8 "strict full mode" by default: -keep class A no longer
# keeps A's no-arg constructor. Firebase Android SDK 33.x (pinned by
# firebase_core 3.x) discovers its ComponentRegistrar classes at runtime via
# Class.forName() from AndroidManifest.xml meta-data, so R8 strips their
# constructors in RELEASE builds. Result:
#   "FirebaseCrashlytics component is not present"
#   -> Firebase.initializeApp() fails
#   -> "No Firebase App '[DEFAULT]' has been created"
# Restore the AGP 8 keep-rule behaviour until the Firebase SDKs are upgraded
# to Crashlytics 20.x+ (Firebase BoM 34.1+, firebase_core 4.x).
android.r8.strictFullModeForKeepRules=false
