name: hesba
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Localization
  easy_localization: ^3.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.10

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3

  # Persistence
  shared_preferences: ^2.3.2

  # UI & Responsive
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2

  # Connectivity
  internet_connection_checker_plus: ^2.7.3

  # External intents (email, whatsapp, call)
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
