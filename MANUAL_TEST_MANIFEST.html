<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>HESBA — دليل الاختبار اليدوي الشامل</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#0f1c3f; --muted:#667085;
    --primary:#2f5fe0; --ok:#12996b; --bad:#d92d20; --warn:#e8a317;
    --line:#e4e8f0; --soft:#eef3ff; --shadow:0 6px 20px rgba(16,32,72,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.75;font-size:15px}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#10224d,#2f5fe0);
    color:#fff;padding:14px 16px 12px;box-shadow:0 4px 18px rgba(16,32,72,.25)}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{font-size:17px;margin:0;font-weight:800}
  header .sub{font-size:11.5px;opacity:.85;margin-top:2px}
  .badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
    border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
  .bar{height:9px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:10px}
  .bar > i{display:block;height:100%;width:0;background:#7ee2b8;border-radius:99px;transition:width .3s}
  .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:7px;opacity:.95}
  .wrap{max-width:1050px;margin:0 auto;padding:14px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input[type=search],select{flex:1;min-width:180px;padding:11px 12px;border:1px solid var(--line);
    border-radius:12px;background:#fff;font-size:14px;color:var(--ink);outline:none}
  input[type=search]:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--soft)}
  button{border:0;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer;
    background:#fff;color:var(--primary);border:1px solid var(--line)}
  button:active{transform:scale(.97)}
  button.danger{color:var(--bad)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;
    color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;
    margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
  .shead{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer;background:#fbfcff}
  .shead .num{background:var(--soft);color:var(--primary);border-radius:10px;
    min-width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:13px}
  .shead h2{font-size:15px;margin:0;flex:1;font-weight:800}
  .shead .cnt{font-size:12px;color:var(--muted);font-weight:700}
  .shead .arrow{color:var(--muted);font-size:12px;transition:transform .2s}
  section.closed .sbody{display:none}
  section.closed .arrow{transform:rotate(-90deg)}
  .sbody{padding:4px 15px 12px}
  .item{display:flex;gap:10px;padding:11px 4px;border-top:1px dashed var(--line);align-items:flex-start}
  .item:first-child{border-top:0}
  .tick{width:26px;height:26px;flex:0 0 26px;border:2px solid #c6cede;border-radius:8px;
    background:#fff;cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;color:#fff;margin-top:2px}
  .tick.done{background:var(--ok);border-color:var(--ok)}
  .ibody{flex:1;min-width:0}
  .it{font-weight:700;font-size:14px}
  .ie{font-size:12.7px;color:var(--muted);margin-top:2px}
  .meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .tag{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--primary);font-weight:700}
  .tag.hi{background:#fff0ec;color:var(--bad)}
  .tag.md{background:#fff8e6;color:#a56a00}
  .tag.lo{background:#eaf8f2;color:var(--ok)}
  .fail{font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer}
  .fail.on{background:var(--bad);border-color:var(--bad);color:#fff}
  .note{width:100%;margin-top:6px;padding:7px 9px;border:1px dashed var(--line);border-radius:9px;
    font-size:12.5px;color:var(--ink);background:#fcfdff;display:none}
  .note.show{display:block}
  .note-btn{font-size:11px;padding:3px 9px;border:0;background:transparent;color:var(--primary);cursor:pointer;text-decoration:underline}
  .item.isfail .it{color:var(--bad)}
  .item.done .it{color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 14px 40px}
  .empty{text-align:center;padding:30px;color:var(--muted)}
  @media print{header{position:static}button,.toolbar,.chips{display:none}.note{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div><h1>HESBA — دليل الاختبار اليدوي</h1><div class="sub">واجهة المالك / الموظف / الأدمن — بلاستيك + اختبارات الفشل والشبكة</div></div>
    <div class="badge" id="pct">0%</div>
  </div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="stats">
    <span>✅ تم: <b id="sok">0</b></span>
    <span>❌ فشل: <b id="sbad">0</b></span>
    <span>⬜ متبقي: <b id="sleft">0</b></span>
    <span>الإجمالي: <b id="stot">0</b></span>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 ابحث في الاختبارات…">
    <select id="filter">
      <option value="all">كل الحالات</option>
      <option value="undone">غير منفذة فقط</option>
      <option value="done">المنفذة فقط</option>
      <option value="failed">الفاشلة فقط</option>
    </select>
    <button id="reset" class="danger">مسح التقدم</button>
    <button id="expand">فتح الكل</button>
  </div>
  <div class="chips" id="roles"></div>
  <div id="sections"></div>
  <footer>يُحفظ التقدم تلقائياً على هذا الجهاز (localStorage) — لا يحتاج إنترنت.</footer>
</div>

/* =====Roles / filtering / persistence =====*/
const KEY='hesba_manual_manifest_v1';
const state=JSON.parse(localStorage.getItem(KEY)||'{}');
let role='all';
const roles=[['all','الكل'],['owner','مالك'],['staff','موظف'],['admin','أدمن']];
const rolesEl=document.getElementById('roles');
roles.forEach(([id,label])=>{
  const b=document.createElement('button');b.className='chip'+(id===role?' on':'');
  b.textContent=label;b.onclick=()=>{role=id;[...rolesEl.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');render();};
  rolesEl.appendChild(b);
});
const uid=(si,ii)=>si+'-'+ii;
function get(si,ii){return state[uid(si,ii)]||{done:false,fail:false,note:''};}
function set(si,ii,v){state[uid(si,ii)]=v;localStorage.setItem(KEY,JSON.stringify(state));render();}
function flat(){let n=0;const out=[];D.forEach((s,si)=>s.items.forEach((it,ii)=>{out.push({si,ii,it});n++;}));return {n,out};}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const f=document.getElementById('filter').value;
  const box=document.getElementById('sections');box.innerHTML='';let shown=0,total=0,done=0,bad=0;
  D.forEach((s,si)=>{
    if(s.role!=='all'&&role!=='all'&&s.role!==role)return;
    const rows=[];
    s.items.forEach((it,ii)=>{
      total++;const st=get(si,ii);if(st.done)done++;if(st.fail)bad++;
      const hay=(it[0]+' '+it[1]).toLowerCase();
      if(q&&!hay.includes(q))return;
      if(f==='undone'&&st.done)return;
      if(f==='done'&&!st.done)return;
      if(f==='failed'&&!st.fail)return;
      shown++;
      const p=it[2]||'lo',pl=p==='hi'?'حرِج':p==='md'?'مهم':'عادي';
      const div=document.createElement('div');
      div.className='item'+(st.done?' done':'')+(st.fail?' isfail':'');
      div.innerHTML=`
        <div class="tick ${st.done?'done':''}" data-a="tick">${st.done?'✓':''}</div>
        <div class="ibody">
          <div class="it">${it[0]}</div>
          <div class="ie">${it[1]}</div>
          <div class="meta">
            <span class="tag ${p}">${pl}</span>
            <button class="fail ${st.fail?'on':''}" data-a="fail">${st.fail?'❌ فشل':'تحديد كفشل'}</button>
            <button class="note-btn" data-a="note">${st.note?'✎ تعديل ملاحظة':'＋ ملاحظة'}</button>
          </div>
          <input class="note ${st.note?'show':''}" data-a="notein" value="${(st.note||'').replace(/"/g,'&quot;')}" placeholder="اكتب أي ملاحظة من الاختبار…">
        </div>`;
      div.querySelector('[data-a=tick]').onclick=()=>{
        const s2=get(si,ii);s2.done=!s2.done;if(s2.done)s2.fail=false;set(si,ii,s2);};
      div.querySelector('[data-a=fail]').onclick=()=>{
        const s2=get(si,ii);s2.fail=!s2.fail;if(s2.fail)s2.done=false;set(si,ii,s2);};
      div.querySelector('[data-a=note]').onclick=()=>{
        const inp=div.querySelector('[data-a=notein]');inp.classList.toggle('show');inp.focus();};
      div.querySelector('[data-a=notein]').onchange=(e)=>{
        const s2=get(si,ii);s2.note=e.target.value;set(si,ii,s2);};
      rows.push(div);
    });
    if(!rows.length)return;
    const sec=document.createElement('section');
    const secDone=s.items.filter((_,ii)=>get(si,ii).done).length;
    sec.innerHTML=`<div class="shead">
      <span class="num">${s.role==='owner'?'م':s.role==='staff'?'و':s.role==='admin'?'أ':'★'}</span>
      <h2>${s.s}</h2><span class="cnt">${secDone}/${s.items.length}</span><span class="arrow▼">▾</span></div>
      <div class="sbody"></div>`;
    const body=sec.querySelector('.sbody');rows.forEach(r=>body.appendChild(r));
    sec.querySelector('.shead').onclick=()=>sec.classList.toggle('closed');
    box.appendChild(sec);
  });
  if(!shown)box.innerHTML='<div class="empty">لا توجد نتائج مطابقة للفلتر.</div>';
  document.getElementById('sok').textContent=done;
  document.getElementById('sbad').textContent=bad;
  document.getElementById('sleft').textContent=total-done-bad;
  document.getElementById('stot').textContent=total;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('barfill').style.width=pct+'%';
}
document.getElementById('search').oninput=render;
document.getElementById('filter').onchange=render;
document.getElementById('reset').onclick=()=>{if(confirm('مسح كل علامات الاختبار على هذا الجهاز؟')){localStorage.removeItem(KEY);for(const k in state)delete state[k];render();}};
document.getElementById('expand').onclick=()=>{
  const secs=[...document.querySelectorAll('section')];const anyClosed=secs.some(s=>s.classList.contains('closed'));
  secs.forEach(s=>s.classList.toggle('closed',!anyClosed));
  document.getElementById('expand').textContent=anyClosed?'طي الكل':'فتح الكل';
};
render();
</script>
